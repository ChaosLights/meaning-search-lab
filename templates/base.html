{# Base layout: Bootstrap 5 + jQuery (HW10 requirement). #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meaning Search Lab{% endblock %}</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="msl-body {% block body_class %}{% endblock %}">

  <header class="msl-header">
    <div class="container-fluid d-flex align-items-center">
      <span class="msl-logo" aria-hidden="true">&#x1F50D;</span>
      <span class="msl-brand">Meaning Search Lab</span>
      {% block header_right %}{% endblock %}
    </div>
  </header>

  <main class="msl-main">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}{% endblock %}

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
